# RuangBaru Go backend — EKS deployment.
# Scaffolding only: nothing here has been applied against a real cluster.
# Fill in the image tag (set by the Bitbucket pipeline) and the secret
# named below (see k8s/secret.example.yaml) before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruangbaru-backend
  labels:
    app: ruangbaru-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ruangbaru-backend
  template:
    metadata:
      labels:
        app: ruangbaru-backend
    spec:
      containers:
        - name: ruangbaru-backend
          image: REPLACE_WITH_ECR_IMAGE_URI:REPLACE_WITH_TAG
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: ruangbaru-backend-secrets
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ruangbaru-backend
spec:
  selector:
    app: ruangbaru-backend
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
